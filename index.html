<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram - Moranguinho</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="strawberry-bg-1">🍓</div>
    <div class="strawberry-bg-2">🍓</div>
    <div class="strawberry-bg-3">🍓</div>
    <div class="strawberry-bg-4">🍓</div>
    <div class="strawberry-bg-5">🍓</div>
    <div class="strawberry-bg-6">🍓</div>
    
    <div class="glitter"></div>
    <div class="glitter glitter2"></div>
    
    <div class="strawberry-girl">
        <img src="https://artpoin.com/wp-content/uploads/2024/06/artpoin-moranguinho-imagens40.png" alt="Moranguinho" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Ccircle cx=\'50\' cy=\'50\' r=\'45\' fill=\'%23FF6B8A\'/%3E%3Ctext x=\'50\' y=\'70\' text-anchor=\'middle\' fill=\'white\' font-size=\'40\'%3E🍓%3C/text%3E%3C/svg%3E'">
        <div class="strawberry-girl-label">Moranguinho</div>
    </div>
    
    <div class="main-layout">
        <div class="container">
            <div class="header-decoration">
                <h1>🍓 Tire sua selfie 🍓</h1>
            </div>
            
            <div class="camera-frame">
                <div class="camera-glow"></div>
                <video id="camera" autoplay></video>
                <canvas id="overlay"></canvas> 
            </div>
        </div>

        <div class="efeitos-sidebar">
            <h3 class="efeitos-title">❀ Efeitos Clássicos ❀</h3>
            <div class="botoes-efeitos">
                <button onclick="capturaPhoto('normal')">
                    <span class="btn-strawberry">🍓</span> Normal
                </button>
                <button onclick="capturaPhoto('cinza')">
                    <span class="btn-strawberry">🍓</span> Cinza
                </button>
                <button onclick="capturaPhoto('antiga')">
                    <span class="btn-strawberry">🍓</span> Antiga
                </button>
                <button onclick="capturaPhoto('desfoque')">
                    <span class="btn-strawberry">🍓</span> Desfoque
                </button>
                <button onclick="capturaPhoto('brilho')">
                    <span class="btn-strawberry">🍓</span> Brilho
                </button>
                <button onclick="capturaPhoto('saturacao')">
                    <span class="btn-strawberry">🍓</span> Saturação
                </button>
                <button onclick="capturaPhoto('espelho')">
                    <span class="btn-strawberry">🍓</span> Inverter
                </button>
                <button onclick="capturaPhoto('opacidade')">
                    <span class="btn-strawberry">🍓</span> Opacidade
                </button>
            </div>

            <h3 class="efeitos-title" style="margin-top: 25px;">❀ Filtros IA ❀</h3>
            <div class="botoes-efeitos">
                <button onclick="capturaPhoto('dalmata')">
                    <span class="btn-strawberry">🐶</span> Dálmata
                </button>
                <button onclick="capturaPhoto('cachorro')">
                    <span class="btn-strawberry">🐶</span> Cachorro
                </button>
                <button onclick="capturaPhoto('barba')">
                    <span class="btn-strawberry">🧔</span> Barba
                </button>
                <button onclick="capturaPhoto('laco')">
                    <span class="btn-strawberry">🎀</span> Laço
                </button>
                <button onclick="capturaPhoto('juliet')">
                    <span class="btn-strawberry">🕶️</span> Juliet
                </button>
            </div>
        </div>
    </div>
    
    <div class="photos-section">
        <div class="section-title">
            <div class="strawberry-decoration">🍓</div>
            <h2>Suas Fotos</h2>
            <div class="strawberry-decoration">🍓</div>
        </div>
        <div id="photos" class="photos"></div>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script defer src="index.js"></script>
</body>
</html>
